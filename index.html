<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="robots" content="noarchive">
    <title>AQ-电脑壁纸</title>
    <link rel='stylesheet' id='style-css' href='static/css/style.css' type='text/css' />
    <link rel='stylesheet' id='fonts-css' href='static/css/iconfont.css' type='text/css' />
    <link rel='stylesheet' id='fancybox-css' href='static/css/jquery.fancybox.min.css' type='text/css' />
    <script type='text/javascript' src='static/js/jquery.min.js'></script>
    <script type='text/javascript' src='static/js/jquery-migrate.min.js'></script>
    <meta name='description' content='包含美女,动漫,风景,游戏,汽车等分类的电脑壁纸' />
    <style type='text/css'>
        html { --accent-color: #4370F5; }
        .site-main { min-height: 700px; }
    </style>
</head>
<body>
    <div class="site">
        <header class="site-header">
            <div class="container">
                <div class="navbar">
                    <div class="hamburger"><div class="hamburgerli"></div></div>
                    <div class="branding-within"> <a class="logo" href="" rel="home">AQ-电脑壁纸</a> </div>
                    <nav class="main-menu hidden-xs hidden-sm hidden-md">
                        <ul id="menu-primary" class="nav-list u-plain-list">
                            <li class="menu-item"><a href="https://wpzy.cc/" target="_blank">AQ网盘论坛</a></li>
                            <li class="menu-item"><a href="https://wpys.cc/" target="_blank">网盘全网搜</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>
        <div class="off-canvas">
            <div class="mobile-menu"> </div>
            <div class="close"> <i class="iconfont icon-guanbi1"></i> </div>
        </div>
        <div class="site-content container">
            <div class="row">
                <div class="col-lg-img">
                    <div class="wallpaper-tags">
                        <ul>
                            <!-- 极数本源支持的中文分类 -->
                            <li data-id="美女" onclick="loadData('美女', true);changeTitle(this)">美女</li>
                            <li data-id="动漫" onclick="loadData('动漫', true);changeTitle(this)">动漫</li>
                            <li data-id="风景" onclick="loadData('风景', true);changeTitle(this)">风景</li>
                            <li data-id="游戏" onclick="loadData('游戏', true);changeTitle(this)">游戏</li>
                            <li data-id="汽车" onclick="loadData('汽车', true);changeTitle(this)">汽车</li>
                            <li data-id="动物" onclick="loadData('动物', true);changeTitle(this)">动物</li>
                            <li data-id="美食" onclick="loadData('美食', true);changeTitle(this)">美食</li>
                            <li data-id="人物" onclick="loadData('人物', true);changeTitle(this)">人物</li>
                            <li data-id="建筑" onclick="loadData('建筑', true);changeTitle(this)">建筑</li>
                            <li data-id="简约" onclick="loadData('简约', true);changeTitle(this)">简约</li>
                            <li data-id="影视" onclick="loadData('影视', true);changeTitle(this)">影视</li>
                            <li data-id="节日" onclick="loadData('节日', true);changeTitle(this)">节日</li>
                            <li data-id="星空" onclick="loadData('星空', true);changeTitle(this)">星空</li>
                            <li data-id="其他" onclick="loadData('其他', true);changeTitle(this)">其他</li>
                        </ul>
                    </div>
                    <div class="content-area">
                        <main class="site-main">
                            <article class="type-post post-wallpaper">
                                <div class="container-wallpaper">
                                    <div class="jigsaw" id="walBox"></div>
                                    <div id="loadmore">壁纸加载中……</div>
                                </div>
                            </article>
                        </main>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="gotop"> <a id="goTopBtn" href="javascript:;"><i class="iconfont icon-shang"></i><em>返回顶部</em></a></div>
    
    <script type='text/javascript' src='static/js/hans.min.js'></script>
    <script type='text/javascript' src='static/js/jquery.fancybox.min.js'></script>
    <script type='text/javascript' src='static/js/jquery.lazyload.min.js'></script>
    <script type='text/javascript' src='static/js/img.js'></script>
</body>
</html>
